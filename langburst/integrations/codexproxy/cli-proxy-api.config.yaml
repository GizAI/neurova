api-keys:
  - sk-codex-local
host: 127.0.0.1
port: 8317

openai-compatibility:
  - name: neurova
    base-url: ${LANGBURST_BASE_URL:-http://192.168.0.47:8008/v1}
    api-key-entries:
      - api-key: ${LANGBURST_OPENAI_COMPAT_API_KEY:-local-langburst}
    models:
      - alias: neurova/qwen
        name: langburst-qwen3.6-27b-q4
        thinking:
          levels:
            - low
            - medium
            - high
            - xhigh
  - name: openrouter
    base-url: https://openrouter.ai/api/v1
    api-key-entries:
      - api-key: ${OPENROUTER_API_KEY}
    headers:
      HTTP-Referer: https://www.giz.ai
      X-Title: LangBurst
    models:
      - alias: glm-5.2:together
        name: z-ai/glm-5.2
        thinking:
          levels:
            - high
      - alias: glm-5.2:friendli
        name: z-ai/glm-5.2
        thinking:
          levels:
            - high

payload:
  override-raw:
    - models:
        - name: "glm-5.2:together"
          protocol: "openai"
      params:
        "provider": "{\"only\":[\"together\"]}"
    - models:
        - name: "glm-5.2:friendli"
          protocol: "openai"
      params:
        "provider": "{\"only\":[\"friendli\"]}"
