[project]
name = "neurova"
version = "0.36.0"
description = "Neurova BrainOS v36 - Developmental neuro-symbolic cognitive OS. No-LLM runtime with schema learning, predictive loop, LLM teacher society, failure-to-schema evolution, and source-grounded internet memory."
requires-python = ">=3.10"

[project.scripts]
neurova = "neurova.cli:main"

[tool.setuptools.packages.find]
include = ["neurova*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
